<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Vehicle Inspection Report</title>
    <style>
        :root {
            --primary: #0056b3;
            --background: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --border: #dddddd;
            --danger: #dc3545;
            --success: #28a745;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1, h2, h3 {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #fafafa;
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="number"],
        select {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 1rem;
        }

        .checklist-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checklist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        .radio-group {
            display: flex;
            gap: 15px;
        }

        .radio-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .btn {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #004494;
        }

        .hidden {
            display: none !important;
        }

        #timestampDisplay {
            font-weight: bold;
            color: var(--primary);
        }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
            }
            .checklist-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .radio-group {
                width: 100%;
                justify-content: flex-start;
                padding-top: 10px;
                border-top: 1px dashed var(--border);
            }
        }
    </style>
</head>
<body>

<div class="container" id="loginView">
    <h1>Warehouse Team Portal</h1>
    <div class="section">
        <h2>Sign In</h2>
        <div class="form-group">
            <label for="driverName">Driver Name / ID</label>
            <input type="text" id="driverName" placeholder="Enter your full name or ID" required>
        </div>
        <button class="btn" onclick="startInspection()">Begin Inspection Report</button>
    </div>
</div>

<div class="container hidden" id="formView">
    <h1>Vehicle Inspection Report</h1>
    <form id="inspectionForm" onsubmit="submitForm(event)">
        
        <div class="section grid-2">
            <div class="form-group">
                <label>Report Type</label>
                <select id="reportType" required>
                    <option value="" disabled selected>Select Pre or Post Trip...</option>
                    <option value="Pre-Trip">Pre-Trip Inspection</option>
                    <option value="Post-Trip">Post-Trip Inspection</option>
                </select>
            </div>
            <div class="form-group">
                <label>Timestamp</label>
                <div id="timestampDisplay"></div>
                <input type="hidden" id="timestampData">
            </div>
        </div>

        <div class="section grid-2">
            <div class="form-group">
                <label for="vehicleId">Vehicle ID / Unit #</label>
                <input type="text" id="vehicleId" required>
            </div>
            <div class="form-group">
                <label for="odometer">Current Odometer</label>
                <input type="number" id="odometer" required>
            </div>
        </div>

        <div class="section grid-3">
            <!-- Engine/Fluid Checks -->
            <div class="checklist-group">
                <h3>Engine / Fluids</h3>
                <script>
                    const engineItems = ['Fuel Level', 'Oil Level', 'Transmission Fluid', 'Coolant', 'Leaks Under Vehicle'];
                    engineItems.forEach((item, index) => {
                        document.write(`
                            <div class="checklist-item">
                                <span>${item}</span>
                                <div class="radio-group">
                                    <label><input type="radio" name="eng_${index}" value="OK" required> OK</label>
                                    <label><input type="radio" name="eng_${index}" value="Defective" class="critical-flag"> Defective</label>
                                </div>
                            </div>
                        `);
                    });
                </script>
            </div>

            <!-- Exterior Checks -->
            <div class="checklist-group">
                <h3>Exterior</h3>
                <script>
                    const exteriorItems = ['Headlights / Taillights', 'Turn Signals', 'Tire Condition', 'Mirrors', 'Body Damage'];
                    exteriorItems.forEach((item, index) => {
                        document.write(`
                            <div class="checklist-item">
                                <span>${item}</span>
                                <div class="radio-group">
                                    <label><input type="radio" name="ext_${index}" value="OK" required> OK</label>
                                    <label><input type="radio" name="ext_${index}" value="Defective" class="critical-flag"> Defective</label>
                                </div>
                            </div>
                        `);
                    });
                </script>
            </div>

            <!-- Interior Checks -->
            <div class="checklist-group">
                <h3>Interior</h3>
                <script>
                    const interiorItems = ['Brakes / Parking Brake', 'Steering', 'Horn', 'Wipers', 'Seatbelts'];
                    interiorItems.forEach((item, index) => {
                        document.write(`
                            <div class="checklist-item">
                                <span>${item}</span>
                                <div class="radio-group">
                                    <label><input type="radio" name="int_${index}" value="OK" required> OK</label>
                                    <label><input type="radio" name="int_${index}" value="Defective" class="critical-flag"> Defective</label>
                                </div>
                            </div>
                        `);
                    });
                </script>
            </div>
        </div>

        <div class="section">
            <div class="form-group">
                <label for="remarks">Remarks / Problem Report (Required if any items are defective)</label>
                <input type="text" id="remarks" placeholder="Describe any issues here...">
            </div>
        </div>

        <button type="submit" class="btn">Submit Report</button>
    </form>
</div>

<script>
    let currentDriver = "";

    function startInspection() {
        const nameInput = document.getElementById('driverName').value.trim();
        if (!nameInput) {
            alert("Please enter a Driver Name or ID to continue.");
            return;
        }
        currentDriver = nameInput;
        
        // Hide Login, Show Form
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('formView').classList.remove('hidden');
        
        // Set Timestamp
        const now = new Date();
        const timestampStr = now.toLocaleString();
        document.getElementById('timestampDisplay').innerText = timestampStr;
        document.getElementById('timestampData').value = timestampStr;
    }

    function submitForm(event) {
        event.preventDefault();

        // 1. Check for critical flags
        const criticalFlags = document.querySelectorAll('.critical-flag:checked');
        const hasCriticalIssue = criticalFlags.length > 0;
        const remarks = document.getElementById('remarks').value.trim();

        if (hasCriticalIssue && remarks === "") {
            alert("You have marked items as Defective. You must provide a description in the Remarks section.");
            return;
        }

        // 2. Gather Data
        const reportType = document.getElementById('reportType').value;
        const timestamp = document.getElementById('timestampData').value;
        const vehicleId = document.getElementById('vehicleId').value;
        const odometer = document.getElementById('odometer').value;

        // 3. Determine Routing
        const managerEmail = "warehouse.manager@company.com";
        const adminEmail = "admin@company.com";
        
        let recipient = managerEmail;
        let cc = hasCriticalIssue ? `?cc=${adminEmail}&` : '?';
        let subject = `Vehicle Report: ${vehicleId} - ${reportType} by ${currentDriver}`;
        
        let body = `
Driver: ${currentDriver}
Report Type: ${reportType}
Timestamp: ${timestamp}
Vehicle ID: ${vehicleId}
Odometer: ${odometer}
Critical Issues Found: ${hasCriticalIssue ? 'YES' : 'NO'}

Remarks: 
${remarks || 'None'}
        `;

        // 4. Execute Submission via mailto (for static GitHub Pages hosting)
        const mailtoLink = `mailto:${recipient}${cc}subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        
        // Open default mail client
        window.location.href = mailtoLink;

        // Reset UI
        alert("Report generated. Please send the drafted email.");
        document.getElementById('inspectionForm').reset();
        document.getElementById('formView').classList.add('hidden');
        document.getElementById('loginView').classList.remove('hidden');
        document.getElementById('driverName').value = "";
    }
</script>

</body>
</html>
