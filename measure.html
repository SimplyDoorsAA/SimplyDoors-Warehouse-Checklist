<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SD Measure">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>SimplyDoors Measure App</title>
<style>
    :root {
        --primary: #76c043;
        --brand-dark: #2c3e50;
        --brand-bg: #f4f7f6;
        --brand-white: #ffffff;
        --ui-blue: #007bff;
        --ui-danger: #dc3545;
        --shadow-card: 0 4px 20px rgba(0,0,0,0.06);
        --radius: 12px;
        --alert-red: #ff0000;
        --gray-container: #f8f9fa;
        --secondary: #6c757d;
        --border: #dddddd;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        background-color: var(--brand-bg);
        margin: 0; padding: 0; 
        padding-top: env(safe-area-inset-top);
        padding-bottom: 160px;
        color: #333;
        -webkit-font-smoothing: antialiased;
    }

    .main-wrapper { padding: 15px; max-width: 850px; margin: 0 auto; }
    .container { 
        background: var(--brand-white); border-radius: var(--radius); 
        box-shadow: var(--shadow-card); overflow: hidden; min-height: 80vh; padding-bottom: 40px;
    }

    /* HEADER */
    .app-header {
        background: var(--brand-white);
        padding-top: calc(15px + env(safe-area-inset-top)); 
        padding-bottom: 20px; padding-left: 20px; padding-right: 20px;
        text-align: center;
        box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        border-bottom: 4px solid var(--primary);
        position: sticky; top: 0; z-index: 900;
        display: flex; justify-content: space-between; align-items: center;
    }
    .logo-container img { height: 45px; width: auto; display: block; margin: 0 auto; }
    .header-actions { display: flex; gap: 10px; }
    .header-btn { background: #edf2f7; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; color: #4a5568; cursor: pointer; font-size: 13px; text-decoration: none; }

    /* LOGIN OVERLAY */
    #login-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: var(--brand-bg); z-index: 9999; 
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 20px;
    }
    .login-box {
        background: white; padding: 40px 30px; border-radius: 16px; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px;
    }
    .login-box h2 { color: var(--brand-dark); margin: 0 0 5px 0; font-size: 24px; font-weight: 800; text-align: center; border: none;}
    .login-box p { color: #888; font-size: 13px; font-weight: 600; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; text-align: center;}
    
    .pill-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .dept-pill {
        background: var(--brand-white); border: 2px solid var(--border); border-radius: 30px;
        padding: 12px; text-align: center; font-weight: bold; cursor: pointer;
        transition: all 0.2s ease; color: var(--secondary); font-size: 14px;
    }
    .dept-pill:hover { border-color: var(--primary); color: var(--primary); }
    .dept-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    
    .login-box select, .login-box input {
        width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 8px;
        font-size: 16px; margin-bottom: 15px; background: #fff;
    }
    .login-box button {
        width: 100%; padding: 16px; background: var(--primary); color: white;
        border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer;
    }

    .hidden { display: none !important; }

    /* UI COMPONENTS */
    .modal-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
        z-index: 2000; display: none; align-items: center; justify-content: center;
    }
    .modal-box {
        background: white; width: 90%; max-width: 400px; padding: 30px; 
        border-radius: 16px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .modal-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; color: var(--brand-dark); }
    .modal-btn-row { display: flex; gap: 15px; }
    .modal-btn {
        flex: 1; padding: 20px; border-radius: 12px; border: 2px solid #eee;
        background: #f8f9fa; font-size: 16px; font-weight: 700; cursor: pointer;
        transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .modal-btn.is-door { color: var(--primary); border-color: var(--primary); background: #f2f9eb; }
    .modal-btn.is-window { color: var(--ui-blue); border-color: var(--ui-blue); background: #f0f7ff; }

    .save-indicator {
        position: fixed; top: 20px; right: 20px; font-size: 12px; font-weight: 700;
        background: var(--primary); color: white; padding: 8px 16px; border-radius: 30px;
        opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000;
        margin-top: env(safe-area-inset-top); box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .empty-state {
        text-align: center; padding: 60px 20px; color: #a0aec0;
        border: 2px dashed #e2e8f0; border-radius: 12px; margin: 20px; background: #fafbfc;
    }
    
    .section { padding: 25px 20px; border-bottom: 1px solid #f0f0f0; }
    .section-title { font-size: 14px; color: var(--brand-dark); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid #eee; padding-bottom: 5px; margin-bottom: 15px; margin-top: 10px; }
    .row { display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; }
    .col { flex: 1; min-width: 120px; }
    label { display: block; margin-top: 18px; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
    
    input:not([type="checkbox"]), select, textarea { 
        width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 8px;
        font-size: 16px; background: #fff; color: #2d3748;
    }
    textarea { resize: vertical; min-height: 80px; line-height: 1.4; }
    .sub-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #a0aec0; margin-bottom: 4px; display: block; }

    .composite-input { display: flex; align-items: center; width: 100%; }
    .composite-input input { border-top-right-radius: 0; border-bottom-right-radius: 0; flex: 1.5; min-width: 0; z-index: 2; }
    .composite-input select { border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: 0; background-color: #f8f9fa; font-weight: 500; text-align: center; flex: 1; min-width: 65px; padding-left: 5px; padding-right: 5px;}

    .toggle-wrapper { position: relative; width: 100%; }
    .custom-input-group { display: flex; gap: 8px; align-items: center; }
    .undo-btn { background: #edf2f7; color: #718096; border: none; width: 46px; height: 48px; border-radius: 8px; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    
    .checklist-container { background-color: var(--gray-container); border-radius: 10px; padding: 10px 15px; margin-top: 5px; border: 1px solid #edf2f7; }
    .checklist-item { display: flex; align-items: center; padding: 12px 0; cursor: pointer; user-select: none; }
    .checklist-item.active .custom-checkbox { background-color: #333; border-color: #333; }
    .checklist-item.active .custom-checkbox::after { content: '✓'; color: white; font-size: 18px; font-weight: 800; }
    .custom-checkbox { width: 24px; height: 24px; border: 2px solid #ccc; border-radius: 6px; margin-right: 12px; background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .checklist-text { font-size: 14px; font-weight: 600; color: #555; }

    .win-toggle-wrap { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
    .win-switch { position: relative; display: inline-block; width: 50px; height: 28px; }
    .win-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--alert-red); }
    input:checked + .slider:before { transform: translateX(22px); }
    .win-toggle-label { font-size: 11px; font-weight: 800; color: #888; margin-bottom: 8px; text-transform: uppercase; }
    .win-toggle-wrap.is-tempered .win-toggle-label { color: var(--alert-red); }

    .measure-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-end; }
    .remove-row { color: #e53e3e; font-weight: bold; padding: 10px; cursor: pointer; font-size: 20px; }
    .btn-add-point { background: none; border: 2px dashed #cbd5e0; width: 100%; padding: 10px; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; margin-top: 5px; color: #555; }

    .photo-grid { display: flex; gap: 10px; margin-top: 20px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 5px; }
    .photo-box {
        flex: 1; min-width: 100px; height: 120px; border: 2px dashed #cbd5e0; border-radius: 10px;
        background-color: #f7fafc; display: flex; align-items: center; justify-content: center;
        cursor: pointer; position: relative; overflow: hidden;
    }
    .photo-box.has-image { border: 2px solid var(--primary); background-color: #fff; }
    .photo-box input[type="file"] { display: none; }
    .photo-placeholder { text-align: center; font-size: 11px; font-weight: 600; color: #718096; pointer-events: none; }
    .photo-preview { width: 100%; height: 100%; object-fit: cover; display: none; max-width: 100%; }
    .photo-clear {
        display: none; position: absolute; top: 5px; right: 5px; background: rgba(220, 53, 69, 0.9);
        color: white; border-radius: 50%; width: 26px; height: 26px; text-align: center;
        line-height: 24px; cursor: pointer; z-index: 10; font-weight: bold; font-size: 18px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .photo-box.has-image .photo-clear { display: block; }

    .measure-card {
        background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
        padding: 25px; margin-bottom: 30px; position: relative;
        box-shadow: 0 4px 10px rgba(0,0,0,0.02);
    }
    .measure-card[data-type="door"] { border-left: 6px solid var(--primary); }
    .measure-card[data-type="window"] { border-left: 6px solid var(--ui-blue); }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .card-badge { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; color: white; }
    .measure-card[data-type="door"] .card-badge { background: var(--primary); }
    .measure-card[data-type="window"] .card-badge { background: var(--ui-blue); }
    .btn-delete { background: #fff1f2; color: #e53e3e; border: none; width: 36px; height: 36px; border-radius: 50%; font-weight: bold; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    .btn-group { 
        padding: 15px 20px; background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
        position: fixed; bottom: 0; left: 0; right: 0; border-top: 1px solid #e2e8f0; 
        box-shadow: 0 -4px 25px rgba(0,0,0,0.1); display: flex; flex-wrap: wrap; gap: 10px;
        z-index: 999; padding-bottom: calc(15px + env(safe-area-inset-bottom));
    }
    button.action-btn { 
        flex: 1; padding: 16px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; 
        cursor: pointer; color: white; text-align: center; min-width: 100px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15); transition: transform 0.1s;
    }
    button.action-btn:active { transform: scale(0.98); }
    .btn-add { background-color: var(--brand-dark); } 
    .btn-dup { background-color: #6f42c1; } 
    .btn-print { background-color: var(--ui-blue); } 
    .btn-reset { background-color: var(--ui-danger); flex-basis: 100%; margin-top: 5px; opacity: 0.9; font-size: 13px; padding: 12px; }

    @media (max-width: 768px) {
        .row { flex-direction: column; align-items: stretch; gap: 0; }
        .col { width: 100%; margin-bottom: 10px; }
        .win-toggle-wrap { align-items: flex-start; margin-top: 10px !important; }
        .photo-box { height: 100px; }
        .measure-card { padding: 15px; }
        .pill-container { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h2>Measure App Setup</h2>
        <p>Confirm Access PIN</p>
        
        <div class="pill-container">
            <div class="dept-pill" onclick="selectDepartment('Warehouse / Driver', this)">Warehouse / Driver</div>
            <div class="dept-pill" onclick="selectDepartment('Production', this)">Production</div>
            <div class="dept-pill" onclick="selectDepartment('Sales', this)">Sales</div>
            <div class="dept-pill" onclick="selectDepartment('Admin', this)">Admin</div>
        </div>

        <div id="loginCredentials" class="hidden">
            <select id="employeeName" required>
                <option value="" disabled selected>Select your name...</option>
            </select>
            <input type="password" id="employeePassword" placeholder="Enter your 6-digit PIN">
            <button id="btn-signin" onclick="verifyLogin()">Access App</button>
        </div>
    </div>
</div>

<header class="app-header">
    <div class="header-actions">
        <button class="header-btn" onclick="window.location.href='index.html'">← Portal</button>
    </div>
    <div class="logo-container">
        <img src="https://raw.githubusercontent.com/SimplyDoorsAA/SimplyDoors-Warehouse-Checklist/main/Simply%20doors%20logo3.png" alt="SimplyDoors" onerror="this.style.display='none';">
    </div>
    <div class="header-actions">
        <button class="header-btn" style="color:var(--ui-danger)" onclick="startNewJob()">Wipe Draft</button>
    </div>
</header>

<div class="save-indicator" id="saveMsg">Local Draft Saved</div>

<div class="modal-overlay" id="typeModal" onclick="closeModal(event)">
    <div class="modal-box">
        <div class="modal-title">Select Item Type</div>
        <div class="modal-btn-row">
            <div class="modal-btn is-door" onclick="selectType('door')">
                <svg viewBox="0 0 24 24"><path d="M8 3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2H8zm8 16H8V5h8v14zm-2-8h-2v2h2v-2z"/></svg>
                Door
            </div>
            <div class="modal-btn is-window" onclick="selectType('window')">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-9-2h2v-2h-2v2zm0-4h2v-2h-2v2zm0-4h2V7h-2v2z"/></svg>
                Window
            </div>
        </div>
    </div>
</div>

<div class="main-wrapper">
    <div class="container" id="pdf-content">
        <div class="section cover-box">
            <div class="section-title">Project Details</div>
            <div class="row">
                <div class="col" style="flex:2;">
                    <label>Customer Name <span style="color:red">*</span></label>
                    <input type="text" class="save-me" placeholder="Enter Customer Name" id="cust_name" autocomplete="off">
                </div>
                <div class="col">
                    <label>PO / Reference #</label>
                    <input type="text" class="save-me" id="po_num" autocomplete="off">
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label>Date</label>
                    <input type="date" class="save-me" id="dateField">
                </div>
                <div class="col">
                    <label>Measured By</label>
                    <input type="text" class="save-me" id="techName" readonly style="background-color: #f1f1f1;">
                </div>
            </div>
        </div>
        
        <div id="measure-container"></div>
    </div>
</div>

<div class="btn-group">
    <button type="button" class="action-btn btn-add" onclick="openModal()">+ Add New</button>
    <button type="button" class="action-btn btn-dup" onclick="duplicateLast()">+ Copy Last</button>
    <button type="button" class="action-btn btn-print" id="submitBtn" onclick="submitMeasureReport()">Submit Report</button>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyVq3CxJOYQAtbtEkTXLOuoQvvImAh20HozVnf254zgITtn5SIVx2CnVbCAAqmklLMXJQ/exec";
    const DB_NAME = "SimplyDoorsMeasureDB";
    const STORE_NAME = "ActiveDraft";

    let currentEmployee = "";
    let saveTimeout;
    
    const teamCategories = {
        "Warehouse / Driver": ["Jaime Mendoza", "Jose Blanco", "Jay Bryant", "Elijah Kimmel"],
        "Production": ["Lupe Sanchez", "Isaiah Stratton", "Ramiro Zuniga", "Gerardo Zuniga"],
        "Sales": ["Adem Atis", "Steven Chandler", "John Suttin", "Cory Broyles", "Dennis Haberer"],
        "Admin": ["Paz Galambos", "Kevin Nguyen"]
    };

    // --- SHARED LOGIN LOGIC ---
    window.onload = async function() {
        const storedUser = localStorage.getItem('sd_current_user');
        if (storedUser) {
            currentEmployee = storedUser;
            document.getElementById('login-overlay').classList.add('hidden');
            document.getElementById('techName').value = currentEmployee;
            await initAndLoadDraft();
        }
    };

    function selectDepartment(dept, element) {
        document.querySelectorAll('.dept-pill').forEach(pill => pill.classList.remove('active'));
        element.classList.add('active');
        const selectMenu = document.getElementById('employeeName');
        selectMenu.innerHTML = '<option value="" disabled selected>Select your name...</option>';
        teamCategories[dept].forEach(name => {
            const option = document.createElement('option');
            option.value = name; option.textContent = name;
            selectMenu.appendChild(option);
        });
        document.getElementById('loginCredentials').classList.remove('hidden');
    }

    async function verifyLogin() {
        const nameSelect = document.getElementById('employeeName').value;
        const passwordInput = document.getElementById('employeePassword').value;
        const loginBtn = document.getElementById('btn-signin');

        if (!nameSelect || !passwordInput) { alert("Please enter PIN."); return; }
        loginBtn.innerText = "Verifying..."; loginBtn.disabled = true;

        try {
            const url = `${GOOGLE_SCRIPT_URL}?action=verifyPin&employee=${encodeURIComponent(nameSelect)}&pin=${encodeURIComponent(passwordInput)}&t=${Date.now()}`;
            const response = await fetch(url);
            const result = await response.json();

            if (result.valid) {
                currentEmployee = nameSelect;
                localStorage.setItem('sd_current_user', currentEmployee);
                localStorage.setItem('sd_is_admin', result.isAdmin === true);
                
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('techName').value = currentEmployee;
                await initAndLoadDraft();
            } else { alert("Incorrect PIN."); }
        } catch (error) { alert("Network Error."); } 
        finally { loginBtn.innerText = "Access App"; loginBtn.disabled = false; }
    }

    // --- INDEXED DB ARCHIVE LOGIC ---
    function initDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = (e) => { e.target.result.createObjectStore(STORE_NAME); };
            request.onsuccess = (e) => resolve(e.target.result);
            request.onerror = (e) => reject(e);
        });
    }

    async function saveDraftToDB(data) {
        const db = await initDB();
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).put(data, "draft");
    }

    async function loadDraftFromDB() {
        const db = await initDB();
        return new Promise((resolve, reject) => {
            const request = db.transaction(STORE_NAME, "readonly").objectStore(STORE_NAME).get("draft");
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    async function clearDraftFromDB() {
        const db = await initDB();
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).delete("draft");
    }

    // --- UI RENDER LOGIC ---
    const container = document.getElementById('measure-container');
    const saveMsg = document.getElementById('saveMsg');
    const modal = document.getElementById('typeModal');

    const optsFractions = ['', '1/8', '1/4', '3/8', '1/2', '5/8', '3/4', '7/8'];
    const getFracOpts = (sel) => optsFractions.map(f => `<option value="${f}" ${f===sel?'selected':''}>${f===''?'':f}</option>`).join('');

    function openModal() { modal.style.display = 'flex'; }
    function closeModal(e) { if(e.target === modal) modal.style.display = 'none'; }
    function selectType(type) { modal.style.display = 'none'; if(type === 'door') addDoor(); else addWindow(); }

    function renderPhotoBox(num, dataUrl) {
        const hasImg = dataUrl ? 'has-image' : '';
        const imgSrc = dataUrl || '';
        const displayImg = dataUrl ? 'block' : 'none';
        const displayPlace = dataUrl ? 'none' : 'block';
        return `
        <div class="photo-box ${hasImg}" onclick="triggerFile(event, this)">
            <div class="photo-clear" onclick="clearPhoto(event, this)">×</div>
            <div class="photo-placeholder" style="display:${displayPlace}">📷<br>Photo ${num}</div>
            <img class="photo-preview" src="${imgSrc}" style="display:${displayImg}">
            <input type="file" accept="image/*" capture="environment" onchange="processImage(this)">
        </div>`;
    }

    function renderToggleField(label, val, options, fieldName) {
        const isCustom = val && !options.includes(val) && val !== '';
        const selStyle = isCustom ? 'display:none' : 'display:block';
        const inpStyle = isCustom ? 'display:flex' : 'display:none';
        let optsHtml = '<option value="" disabled selected>Select...</option>';
        options.forEach(opt => { optsHtml += `<option ${(opt === val) ? 'selected' : ''}>${opt}</option>`; });
        optsHtml += `<option value="Custom">Custom (Type...)</option>`;
        return `
        <div class="toggle-field-wrapper" style="width:100%;">
            <label>${label}</label>
            <div class="toggle-wrapper">
                <select class="save-me-dynamic" name="${fieldName}_sel" style="${selStyle}" onchange="checkCustom(this)">${optsHtml}</select>
                <div class="custom-input-group" style="${inpStyle}">
                    <input type="text" name="${fieldName}_inp" value="${isCustom ? val : ''}" oninput="triggerSave()">
                    <button type="button" class="undo-btn" onclick="resetToggle(this)">×</button>
                </div>
            </div>
        </div>`;
    }

    function checkCustom(select) {
        if(select.value === 'Custom') {
            const wrap = select.parentElement; select.style.display = 'none';
            wrap.querySelector('.custom-input-group').style.display = 'flex';
            wrap.querySelector('input').focus();
        }
        triggerSave();
    }
    
    function resetToggle(btn) {
        const wrap = btn.closest('.toggle-wrapper');
        wrap.querySelector('input').value = ''; wrap.querySelector('select').value = '';
        wrap.querySelector('.custom-input-group').style.display = 'none';
        wrap.querySelector('select').style.display = 'block';
        triggerSave();
    }

    function renderWallThickField(valWhole, valFrac) {
        const presets = ["4 9/16", "6 9/16", "3 1/2", "5 1/2"];
        const currentCombined = (valWhole && valFrac) ? `${valWhole} ${valFrac}` : valWhole;
        const isCustom = !presets.includes(currentCombined) && (valWhole !== '' || valFrac !== '');
        const selStyle = isCustom ? 'display:none' : 'display:block';
        const inpStyle = isCustom ? 'display:flex' : 'display:none';
        let optsHtml = '<option value="" disabled selected>Select...</option>';
        presets.forEach(p => { const sel = (p === currentCombined) ? 'selected' : ''; optsHtml += `<option value="${p}" ${sel}>${p}</option>`; });
        optsHtml += `<option value="Custom">Custom (Type...)</option>`;
        return `
        <div class="wall-thick-wrapper" style="width:100%;">
            <label>Wall Thick</label>
            <select class="wall-preset save-me-dynamic" name="wall_sel" style="${selStyle}" onchange="toggleWallThick(this)">${optsHtml}</select>
            <div class="composite-input wall-custom" style="${inpStyle}">
                <input type="text" inputmode="decimal" name="wall_w" class="save-me-dynamic" value="${valWhole}" placeholder="0" oninput="triggerSave()">
                <select class="save-me-dynamic" name="wall_f" onchange="triggerSave()">${getFracOpts(valFrac)}</select>
                <button type="button" class="undo-btn" onclick="resetWallThick(this)" style="margin-left:5px; height:42px; width:40px;">×</button>
            </div>
        </div>`;
    }

    function toggleWallThick(select) {
        if(select.value === 'Custom') { const wrap = select.parentElement; select.style.display = 'none'; wrap.querySelector('.wall-custom').style.display = 'flex'; }
        triggerSave();
    }
    
    function resetWallThick(btn) {
        const wrap = btn.closest('.wall-thick-wrapper'); const sel = wrap.querySelector('.wall-preset');
        const customDiv = wrap.querySelector('.wall-custom');
        customDiv.style.display = 'none'; sel.style.display = 'block'; sel.value = "";
        customDiv.querySelector('input').value = ""; customDiv.querySelectorAll('select')[0].value = "";
        triggerSave();
    }

    const doorConfig = ['Single', 'Double', 'Sgl w/ 1 SL', 'Sgl w/ 2 SL'];
    const doorHanding = ['Left Hand Inswing', 'Right Hand Inswing', 'Left Hand Outswing', 'Right Hand Outswing', 'Slider'];

    function addDoor(data = null) {
        if(container.querySelector('.empty-state')) container.innerHTML = '';
        const count = container.querySelectorAll('.measure-card').length + 1;
        const vals = data || {
            loc: '', config: '', handing: '', dim_type: '', w: '', w_frac: '', h: '', h_frac: '', jamb: '', bore: '', ext: '', int: '',
            l_tile: false, l_wood: false, l_cem: false, l_wsupp: false, l_custom: '', notes: '', p1: null, p2: null, p3: null
        };
        const id = 'card_' + Date.now() + Math.floor(Math.random()*1000);

        const html = `
        <div class="measure-card" id="${id}" data-type="door">
            <div class="card-header"><div class="card-badge">DOOR #${count}</div><button class="btn-delete" onclick="deleteItem('${id}')">×</button></div>
            <div class="row"><div class="col"><label>Location</label><input type="text" class="save-me-dynamic" name="loc" placeholder="e.g. Front Entry" value="${vals.loc}"></div></div>
            <div class="row"><div class="col">${renderToggleField('Config', vals.config, doorConfig, 'config')}</div><div class="col">${renderToggleField('Handing', vals.handing, doorHanding, 'handing')}</div></div>
            <div class="row">
                <div class="col" style="flex: 1.2;"><span class="sub-label">Type</span>
                    <select class="save-me-dynamic" name="dim_type"><option value="" disabled ${vals.dim_type===''?'selected':''}>Select...</option><option ${vals.dim_type==='Unit Size'?'selected':''}>Unit Size</option><option ${vals.dim_type==='Rough Opening'?'selected':''}>Rough Opening</option></select>
                </div>
                <div class="col" style="flex: 2;"><span class="sub-label">Width</span>
                    <div class="composite-input"><input type="text" inputmode="decimal" class="save-me-dynamic" name="w" value="${vals.w}" placeholder='0"'><select class="save-me-dynamic" name="w_frac">${getFracOpts(vals.w_frac)}</select></div>
                </div>
                <div class="col" style="flex: 2;"><span class="sub-label">Height</span>
                    <div class="composite-input"><input type="text" inputmode="decimal" class="save-me-dynamic" name="h" value="${vals.h}" placeholder='0"'><select class="save-me-dynamic" name="h_frac">${getFracOpts(vals.h_frac)}</select></div>
                </div>
            </div>
            <div class="row"><div class="col">${renderToggleField('Jamb Depth', vals.jamb, ['4 9/16','6 9/16','5 1/4'], 'jamb')}</div><div class="col">${renderToggleField('Bore / Lock', vals.bore, ['Single Bore','Double Bore','Mortise','None'], 'bore')}</div></div>
            <div class="row"><div class="col">${renderToggleField('Ext Trim', vals.ext, ['Brickmould','1x4','1x6','No Trim'], 'ext')}</div><div class="col">${renderToggleField('Int Trim', vals.int, ['2 1/4 Casing','2 1/2 Col. Casing','3 1/4 Casing','1x4','No Trim'], 'int')}</div></div>
            <div class="row"><div class="col"><label>Labor</label>
                <div class="checklist-container door-labor-container">
                    <div class="checklist-item ${vals.l_tile?'active':''}" onclick="toggleCheck(this)"><div class="custom-checkbox"></div><span class="checklist-text">Cut Tile</span></div>
                    <div class="checklist-item ${vals.l_wood?'active':''}" onclick="toggleCheck(this)"><div class="custom-checkbox"></div><span class="checklist-text">Cut Wood</span></div>
                    <div class="checklist-item ${vals.l_cem?'active':''}" onclick="toggleCheck(this)"><div class="custom-checkbox"></div><span class="checklist-text">Cement Support</span></div>
                    <div class="checklist-item ${vals.l_wsupp?'active':''}" onclick="toggleCheck(this)"><div class="custom-checkbox"></div><span class="checklist-text">Wood Support</span></div>
                    <input type="text" class="save-me-dynamic" name="l_custom" placeholder="Custom Labor..." value="${vals.l_custom}" style="margin-top:8px;">
                </div>
            </div></div>
            <div class="row"><div class="col"><label>Notes</label><textarea class="save-me-dynamic" name="notes">${vals.notes}</textarea></div></div>
            <div class="photo-grid">${renderPhotoBox(1, vals.p1)}${renderPhotoBox(2, vals.p2)}${renderPhotoBox(3, vals.p3)}</div>
        </div>`;
        insertAndInit(html, id, data);
    }

    function addWindow(data = null) {
        if(container.querySelector('.empty-state')) container.innerHTML = '';
        const count = container.querySelectorAll('.measure-card').length + 1;
        const vals = data || {
            loc: '', floor: '1st', qty: '1', mType: '', measurements: [{w:'',wf:'',h:'',hf:''}], sill: '', sill_f: '', wall: '', wall_f: '', tempered: false, mat: '', frame: '',
            ext: '', int: '', labor: [], customLabor: '', notes: '', p1:null, p2:null, p3:null
        };
        const id = 'card_' + Date.now() + Math.floor(Math.random()*1000);
        const tempClass = vals.tempered ? 'is-tempered' : '';

        const html = `
        <div class="measure-card" id="${id}" data-type="window">
            <div class="card-header"><div class="card-badge">WINDOW #${count}</div><button class="btn-delete" onclick="deleteItem('${id}')">×</button></div>
            <div class="row">
                <div class="col" style="flex:2"><label>Loc/Mark</label><input type="text" name="loc" class="save-me-dynamic" value="${vals.loc}"></div>
                <div class="col"><label>Floor</label><select name="floor" class="save-me-dynamic"><option ${vals.floor==='1st'?'selected':''}>1st</option><option ${vals.floor==='2nd'?'selected':''}>2nd</option><option ${vals.floor==='3rd'?'selected':''}>3rd</option></select></div>
                <div class="col" style="flex:0.6"><label>Qty</label><input type="number" name="qty" class="save-me-dynamic" value="${vals.qty}"></div>
            </div>
            <div class="row" style="flex-direction:column; align-items:stretch;">
                <label>Measure Points</label>
                <select class="save-me-dynamic" name="mType" style="margin-bottom:10px;"><option value="" disabled ${vals.mType===''?'selected':''}>Basis (RO/Unit/DO)...</option><option ${vals.mType==='Rough Opening'?'selected':''}>Rough Opening</option><option ${vals.mType==='Unit Size'?'selected':''}>Unit Size</option><option ${vals.mType==='Daylight'?'selected':''}>Daylight</option></select>
                <div id="rows_${id}"></div><button type="button" class="btn-add-point" onclick="addMeasureRow('${id}')">+ Add Point</button>
            </div>
            <div class="row">
                <div class="col"><label>Floor to Sill</label><div class="composite-input"><input type="text" inputmode="decimal" class="save-me-dynamic" name="sill" value="${vals.sill}"><select class="save-me-dynamic" name="sill_f">${getFracOpts(vals.sill_f)}</select></div></div>
                <div class="col" style="flex: 0.6;"><div class="win-toggle-wrap ${tempClass}" style="margin-top:18px"><div class="win-toggle-label">Tempered</div><label class="win-switch"><input type="checkbox" class="save-me-dynamic temp-check" name="tempered" ${vals.tempered?'checked':''} onchange="toggleTempered(this)"><span class="slider"></span></label></div></div>
                <div class="col">${renderWallThickField(vals.wall, vals.wall_f)}</div>
            </div>
            <div class="row">
                <div class="col"><label>Material</label><select name="mat" class="save-me-dynamic"><option value="" ${vals.mat===''?'selected':''}>Select...</option><option ${vals.mat==='Wood Stud'?'selected':''}>Wood Stud</option><option ${vals.mat==='CMU/Block'?'selected':''}>CMU/Block</option></select></div>
                <div class="col"><label>Frame Depth</label><select name="frame" class="save-me-dynamic"><option value="" ${vals.frame===''?'selected':''}>Select...</option><option ${vals.frame==='4-1/2"'?'selected':''}>4-1/2"</option><option ${vals.frame==='6"'?'selected':''}>6"</option></select></div>
            </div>
            <div class="row">
                <div class="col"><label>Ext Trim</label><select name="ext" class="save-me-dynamic"><option value="" ${vals.ext===''?'selected':''}>Select...</option><option ${vals.ext==='1x4 Vinyl'?'selected':''}>1x4 Vinyl</option><option ${vals.ext==='No Trim'?'selected':''}>No Trim</option></select></div>
                <div class="col"><label>Int Trim</label><select name="int" class="save-me-dynamic"><option value="" ${vals.int===''?'selected':''}>Select...</option><option ${vals.int==='Drywall'?'selected':''}>Drywall Return</option><option ${vals.int==='Casing'?'selected':''}>Casing</option></select></div>
            </div>
            <div class="row"><div class="col"><label>Labor</label><div class="checklist-container win-labor-container">${renderWinCheck('Cut Sheetrock/Wood', vals.labor)}${renderWinCheck('Cut Tile/Granite', vals.labor)}${renderWinCheck('Stucco Removal', vals.labor)}<input type="text" name="customLabor" class="save-me-dynamic" placeholder="Custom Labor..." value="${vals.customLabor}" style="margin-top:8px;"></div></div></div>
            <div class="row"><div class="col"><label>Notes</label><textarea name="notes" class="save-me-dynamic">${vals.notes}</textarea></div></div>
            <div class="photo-grid">${renderPhotoBox(1, vals.p1)}${renderPhotoBox(2, vals.p2)}${renderPhotoBox(3, vals.p3)}</div>
        </div>`;
        insertAndInit(html, id, data);
        if(vals.measurements) vals.measurements.forEach(m => addMeasureRow(id, m.w, m.wf, m.h, m.hf)); else addMeasureRow(id);
    }

    function renderWinCheck(txt, arr) { return `<div class="checklist-item ${arr.includes(txt)?'active':''}" onclick="toggleCheck(this)"><div class="custom-checkbox"></div><span class="checklist-text">${txt}</span></div>`; }
    function toggleTempered(cb) { cb.closest('.win-toggle-wrap').classList.toggle('is-tempered', cb.checked); triggerSave(); }
    function addMeasureRow(cardId, w='', wf='', h='', hf='') {
        const rowId = 'row_' + Date.now() + Math.floor(Math.random()*100);
        const html = `
        <div class="measure-row" id="${rowId}">
            <div class="col"><div class="composite-input"><input type="text" inputmode="decimal" class="m-w" value="${w}" placeholder="W" oninput="triggerSave()"><select class="m-hf" onchange="triggerSave()">${getFracOpts(wf)}</select></div></div>
            <div class="col"><div class="composite-input"><input type="text" inputmode="decimal" class="m-h" value="${h}" placeholder="H" oninput="triggerSave()"><select class="m-hf" onchange="triggerSave()">${getFracOpts(hf)}</select></div></div>
            <div class="remove-row" onclick="this.closest('.measure-row').remove(); triggerSave();">&times;</div>
        </div>`;
        document.getElementById(`rows_${cardId}`).insertAdjacentHTML('beforeend', html);
    }

    function insertAndInit(html, id, data) {
        container.insertAdjacentHTML('beforeend', html);
        const card = document.getElementById(id);
        card.querySelectorAll('.save-me-dynamic').forEach(el => { el.addEventListener('input', triggerSave); el.addEventListener('change', triggerSave); });
        if(!data) { setTimeout(() => card.scrollIntoView({ behavior: "smooth", block: "center" }), 150); triggerSave(); }
    }

    function toggleCheck(item) { item.classList.toggle('active'); triggerSave(); }
    function deleteItem(id) {
        if(confirm('Delete this item?')) {
            document.getElementById(id).remove(); renumber();
            if(container.querySelectorAll('.measure-card').length === 0) renderEmptyState();
            triggerSave();
        }
    }
    function renumber() {
        let d = 1, w = 1;
        document.querySelectorAll('.measure-card').forEach(c => {
            const badge = c.querySelector('.card-badge');
            if(c.dataset.type === 'door') badge.innerText = `DOOR #${d++}`; else badge.innerText = `WINDOW #${w++}`;
        });
    }

    function renderEmptyState() {
        container.innerHTML = `<div class="empty-state"><h3>Ready to Start</h3><p>Fill out Project Details above.<br>Then tap <b>+ Add New</b> to measure.</p></div>`;
    }

    async function duplicateLast() {
        const cards = container.querySelectorAll('.measure-card');
        if(cards.length === 0) return openModal();
        const payload = extractPayload();
        if(!payload.items || payload.items.length === 0) return;
        const lastData = payload.items[payload.items.length - 1];
        const clean = JSON.parse(JSON.stringify(lastData));
        clean.loc = ''; clean.notes = ''; clean.p1 = null; clean.p2 = null; clean.p3 = null;
        if(lastData.type === 'window') { clean.measurements = [{w:'',wf:'',h:'',hf:''}]; addWindow(clean); } else { clean.w = ''; clean.w_frac = ''; clean.h = ''; clean.h_frac = ''; addDoor(clean); }
    }

    function triggerFile(e, box) { if(e.target.classList.contains('photo-clear')) return; box.querySelector('input').click(); }
    function clearPhoto(e, btn) {
        e.stopPropagation(); const box = btn.closest('.photo-box'); const img = box.querySelector('.photo-preview');
        box.classList.remove('has-image'); img.src = ''; img.style.display = 'none';
        box.querySelector('.photo-placeholder').style.display = 'block'; box.querySelector('input').value = ''; 
        triggerSave();
    }

    function processImage(input) {
        const file = input.files[0]; if(!file) return;
        const box = input.parentElement; const img = box.querySelector('.photo-preview');
        const place = box.querySelector('.photo-placeholder'); place.style.display='none'; 
        const reader = new FileReader();
        reader.onload = function(e) {
            const temp = new Image();
            temp.onload = function() {
                const cvs = document.createElement('canvas'); const ctx = cvs.getContext('2d');
                const MAX_WIDTH = 800; let scale = 1;
                if(temp.width > MAX_WIDTH) scale = MAX_WIDTH / temp.width;
                cvs.width = temp.width * scale; cvs.height = temp.height * scale;
                ctx.drawImage(temp, 0, 0, cvs.width, cvs.height);
                img.src = cvs.toDataURL('image/jpeg', 0.60); 
                img.style.display='block'; box.classList.add('has-image'); 
                cvs.width = 0; cvs.height = 0; triggerSave();
            }
            temp.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    document.querySelectorAll('.save-me').forEach(e => e.addEventListener('input', triggerSave));

    // --- DATA EXTRACTION & SUBMISSION ---
    function triggerSave() { clearTimeout(saveTimeout); saveTimeout = setTimeout(performLocalSave, 800); }

    function extractPayload() {
        const glob = {
            cust: document.getElementById('cust_name').value,
            po: document.getElementById('po_num').value,
            date: document.getElementById('dateField').value,
            tech: document.getElementById('techName').value
        };
        const items = [];
        document.querySelectorAll('.measure-card').forEach(card => {
            const type = card.dataset.type;
            const imgs = card.querySelectorAll('.photo-preview');
            const getSrc = (imgEl) => (imgEl.src && imgEl.src.startsWith('data:')) ? imgEl.src : null;
            const p1 = getSrc(imgs[0]), p2 = getSrc(imgs[1]), p3 = getSrc(imgs[2]);

            if(type === 'door') {
                const getToggleVal = (baseName) => {
                    const sel = card.querySelector(`[name="${baseName}_sel"]`); const inp = card.querySelector(`[name="${baseName}_inp"]`);
                    if (!sel || !inp) return ''; return (sel.style.display === 'none') ? inp.value : sel.value;
                };
                const checks = card.querySelectorAll('.door-labor-container .checklist-item');
                items.push({
                    type: 'door', loc: card.querySelector('[name="loc"]').value, config: getToggleVal('config'), handing: getToggleVal('handing'),
                    dim_type: card.querySelector('[name="dim_type"]').value, w: card.querySelector('[name="w"]').value, w_frac: card.querySelector('[name="w_frac"]').value,
                    h: card.querySelector('[name="h"]').value, h_frac: card.querySelector('[name="h_frac"]').value,
                    jamb: getToggleVal('jamb'), bore: getToggleVal('bore'), ext: getToggleVal('ext'), int: getToggleVal('int'),
                    l_tile: checks[0] && checks[0].classList.contains('active'), l_wood: checks[1] && checks[1].classList.contains('active'),
                    l_cem: checks[2] && checks[2].classList.contains('active'), l_wsupp: checks[3] && checks[3].classList.contains('active'),
                    l_custom: card.querySelector('[name="l_custom"]').value, notes: card.querySelector('[name="notes"]').value, p1, p2, p3
                });
            } else {
                const mRows = [];
                card.querySelectorAll('.measure-row').forEach(r => {
                    mRows.push({ w: r.querySelector('.m-w').value, wf: r.querySelectorAll('select')[0].value, h: r.querySelector('.m-h').value, hf: r.querySelectorAll('select')[1].value });
                });
                const laborArr = [];
                card.querySelectorAll('.win-labor-container .checklist-item.active .checklist-text').forEach(t => laborArr.push(t.innerText));
                const preset = card.querySelector('[name="wall_sel"]'); 
                const customWhole = card.querySelector('[name="wall_w"]'); const customFrac = card.querySelector('[name="wall_f"]');
                let wallW='', wallF='';
                if (preset && preset.value && preset.value !== 'Custom') { const p = preset.value.split(' '); wallW = p[0]; wallF = p[1]||''; }
                else if(customWhole) { wallW = customWhole.value; wallF = customFrac.value; }
                
                items.push({
                    type: 'window', loc: card.querySelector('[name="loc"]').value, floor: card.querySelector('[name="floor"]').value, 
                    qty: card.querySelector('[name="qty"]').value, mType: card.querySelector('[name="mType"]').value, measurements: mRows,
                    sill: card.querySelector('[name="sill"]').value, sill_f: card.querySelector('[name="sill_f"]').value, tempered: card.querySelector('.temp-check').checked,
                    wall: wallW, wall_f: wallF, mat: card.querySelector('[name="mat"]').value, frame: card.querySelector('[name="frame"]').value,
                    ext: card.querySelector('[name="ext"]').value, int: card.querySelector('[name="int"]').value, labor: laborArr, customLabor: card.querySelector('[name="customLabor"]').value,
                    notes: card.querySelector('[name="notes"]').value, p1, p2, p3
                });
            }
        });
        return { global: glob, items: items };
    }

    async function performLocalSave() {
        const payload = extractPayload();
        await saveDraftToDB(payload);
        saveMsg.innerText = "Draft Saved";
        saveMsg.style.opacity = '1'; setTimeout(() => saveMsg.style.opacity = '0', 1500);
    }

    async function initAndLoadDraft() {
        const data = await loadDraftFromDB();
        if(data && data.global) {
            document.getElementById('cust_name').value = data.global.cust || '';
            document.getElementById('po_num').value = data.global.po || '';
            document.getElementById('dateField').value = data.global.date || '';
            container.innerHTML = '';
            if(data.items && data.items.length > 0) {
                data.items.forEach(item => { if(item.type === 'door') addDoor(item); else addWindow(item); });
            } else { renderEmptyState(); }
        } else {
            const d = new Date(); const y = d.getFullYear(); const m = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0');
            document.getElementById('dateField').value = `${y}-${m}-${day}`;
            renderEmptyState();
        }
    }

    async function startNewJob() {
        if(confirm("⚠️ Wipe Draft? This will permanently delete your current measurements.")) {
            await clearDraftFromDB();
            location.reload();
        }
    }

    async function submitMeasureReport() {
        const custName = document.getElementById('cust_name').value.trim();
        if(!custName) { alert("⚠️ Customer Name is required before submitting."); return; }
        
        const btn = document.getElementById('submitBtn');
        const oldText = btn.innerText;
        btn.innerText = "Transmitting..."; btn.disabled = true;

        const payloadJson = extractPayload();
        
        const formData = new FormData();
        formData.append("FormType", "Measure Report");
        formData.append("Employee", currentEmployee);
        formData.append("Customer", custName);
        formData.append("MeasurePayload", JSON.stringify(payloadJson));

        try {
            await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: formData, mode: 'no-cors' });
            alert("Report successfully submitted.");
            await clearDraftFromDB();
            location.reload();
        } catch (error) {
            alert("Transmission failed. Check internet connection. Draft remains saved locally.");
        } finally {
            btn.innerText = oldText; btn.disabled = false;
        }
    }
</script>
</body>
</html>
